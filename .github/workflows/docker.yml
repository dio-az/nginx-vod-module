name: Docker

on:
  workflow_call:
    inputs: &inputs
      nginx-version:
        description: NGINX version (latest match)
        type: string
        required: true
      ffmpeg-version:
        description: FFmpeg version (latest match)
        type: string
        required: true
      promote:
        description: Tag as release version and latest
        type: boolean
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ubuntu-26.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    if: github.ref_type == 'tag'
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          target: runtime
          build-args: |
            RELEASE=1
            NGINX_VERSION=${{ inputs.nginx-version }}
            FFMPEG_VERSION=${{ inputs.ffmpeg-version }}
          platforms: linux/${{ matrix.arch }}
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - id: digest
        run: echo ${{ matrix.arch }}=${{ steps.build.outputs.digest }} >> $GITHUB_OUTPUT

  merge:
    name: Publish manifest
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$IMAGE:${GITHUB_REF_NAME#v}
          variant=$version-nginx${{ inputs.nginx-version }}

          tags="-t $variant"
          if ${{ inputs.promote }}; then
            latest=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)
            tags="$tags -t $version"
            if [ $latest = $GITHUB_REF_NAME ]; then
              tags="$tags -t $IMAGE:latest"
            fi
          fi

          docker buildx imagetools create $tags \
            --annotation 'index:org.opencontainers.image.description=${{ github.event.repository.description }}' \
            $IMAGE@${{ needs.build.outputs.amd64 }} \
            $IMAGE@${{ needs.build.outputs.arm64 }}
          echo digest=$(docker buildx imagetools inspect $variant --format '{{.Manifest.Digest}}') >> $GITHUB_OUTPUT
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
