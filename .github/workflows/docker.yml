name: Docker

on:
  workflow_call:
    inputs: &inputs
      nginx-version:
        description: NGINX version (latest match)
        type: string
        required: true
      ffmpeg-version:
        description: FFmpeg version (latest match)
        type: string
        required: true
      promote:
        description: Tag as release version and latest
        type: boolean
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ubuntu-26.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    if: github.ref_type == 'tag'
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          target: runtime
          build-args: |
            RELEASE=1
            NGINX_VERSION=${{ inputs.nginx-version }}
            FFMPEG_VERSION=${{ inputs.ffmpeg-version }}
          platforms: linux/${{ matrix.arch }}
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - id: digest
        run: echo ${{ matrix.arch }}=${{ steps.build.outputs.digest }} >> $GITHUB_OUTPUT

  merge:
    name: Publish manifest
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$IMAGE:${GITHUB_REF_NAME#v}
          variant=$version-nginx${{ inputs.nginx-version }}

          tags="-t $variant"
          if ${{ inputs.promote }}; then
            latest=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)
            tags="$tags -t $version"
            if [ $latest = $GITHUB_REF_NAME ]; then
              tags="$tags -t $IMAGE:latest"
            fi
          fi

          docker buildx imagetools create $tags \
            --annotation 'index:org.opencontainers.image.description=${{ github.event.repository.description }}' \
            $IMAGE@${{ needs.build.outputs.amd64 }} \
            $IMAGE@${{ needs.build.outputs.arm64 }}
          echo digest=$(docker buildx imagetools inspect $variant --format '{{.Manifest.Digest}}') >> $GITHUB_OUTPUT
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
